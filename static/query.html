<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>查詢消費紀錄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #f9f9f9; 
      font-size: 18px;
    }
    h2 { text-align: center; }
    form {
      background: white; padding: 15px; border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      max-width: 600px; margin: auto; font-size: 18px;
    }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    .date-range {
      display: flex; 
      gap: 10px; 
      align-items: center;
    }
    .date-range input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc; 
      border-radius: 5px; 
      font-size: 16px;
    }
    button {
      margin-top: 15px; width: 100%; padding: 14px;
      background: #06c755; color: white; border: none; border-radius: 5px;
      font-size: 18px; cursor: pointer;
    }
    #result { margin-top: 20px; max-width: 700px; margin-left: auto; margin-right: auto; }

    /* 收合區塊樣式 */
    details {
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 0.5rem 0.8rem;
      background: #fff;
      transition: all 0.2s ease;
    }
    details[open] {
      background: #f0f8ff;
      border-color: #3399ff;
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      outline: none;
      list-style: none;
      font-size: 18px;
    }
    summary::-webkit-details-marker {
      display: none; /* 隱藏預設箭頭 */
    }
    summary::before {
      content: "▶";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s ease;
    }
    details[open] summary::before {
      transform: rotate(90deg);
    }

    /* 表格樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 16px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
    }
    th {
      background: #e6f2ff;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    tr:nth-child(odd) {
      background: #ffffff;
    }
    td:last-child {
      text-align: right; /* 金額靠右 */
    }
    .subtotal {
      font-weight: bold;
      background: #fff3cd;
    }
    .grand-total {
      margin-top: 20px;
      padding: 12px;
      background: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 6px;
      font-weight: bold;
      font-size: 18px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h2>查詢消費紀錄</h2>
  <form id="queryForm">
    <label>查詢區間</label>
    <div class="date-range">
      <input type="date" id="start_date" required>
      <span>～</span>
      <input type="date" id="end_date" required>
    </div>
    <button type="submit">查詢</button>
  </form>

  <div id="result"></div>

  <script>
    async function main() {
      await liff.init({ liffId: "2008057774-3klY0YGz" }); // ⚠️換成你的 LIFF ID

      const form = document.getElementById("queryForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const start_date = document.getElementById("start_date").value;
        const end_date = document.getElementById("end_date").value;

        const resp = await fetch("/query", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + liff.getAccessToken()
          },
          body: JSON.stringify({ start_date, end_date })
        });

        const data = await resp.json();
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        if (data.status !== "success" || !data.data || Object.keys(data.data).length === 0) {
          resultDiv.innerHTML = "<p>查無資料</p>";
          return;
        }

        let grandTotal = 0;

        // 使用 details + table 收合顯示
        for (const [category, records] of Object.entries(data.data)) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = category;
          details.appendChild(summary);

          const table = document.createElement("table");
          const thead = document.createElement("thead");
          thead.innerHTML = "<tr><th>日期</th><th>項目</th><th>金額</th></tr>";
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          let subtotal = 0;
          records.forEach(r => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${r.date}</td><td>${r.item}</td><td>$${r.amount}</td>`;
            tbody.appendChild(tr);
            subtotal += Number(r.amount);
          });

          // 小計行
          const subtotalTr = document.createElement("tr");
          subtotalTr.className = "subtotal";
          subtotalTr.innerHTML = `<td colspan="2">小計</td><td>$${subtotal}</td>`;
          tbody.appendChild(subtotalTr);

          table.appendChild(tbody);
          details.appendChild(table);
          resultDiv.appendChild(details);

          grandTotal += subtotal;
        }

        // 總金額
        const grandDiv = document.createElement("div");
        grandDiv.className = "grand-total";
        grandDiv.textContent = `全部總金額：$${grandTotal}`;
        resultDiv.appendChild(grandDiv);
      });
    }
    main();
  </script>
</body>
</html>
