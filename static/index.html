<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>新增消費紀錄</title>
  <!-- ✅ 讓 iPhone 可滿版顯示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    h2 {
      text-align: center;
      font-size: 1.8rem;
      margin: 20px 0;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 600px;
      box-sizing: border-box;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
      font-size: 1.1rem;
    }
    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1.1rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #04a944; }
  </style>
</head>
<body>
  <h2>新增消費紀錄</h2>
  <form id="paymentForm">
    <label>日期</label>
    <input type="date" id="pay_dt" required>

    <label>類別</label>
    <select id="category" required>
      <option value="">請選擇</option>
      <option value="飲食">飲食</option>
      <option value="交通">交通</option>
      <option value="住宿">住宿</option>
    </select>

    <label>描述</label>
    <input type="text" id="item" placeholder="例如：午餐 / 高鐵票 / 飯店" required>

    <label>金額</label>
    <input type="number" id="amount" required>

    <button type="submit">送出</button>
  </form>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2008057774-P62MrMmp" }); // ← 換成你的 LIFF ID

        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          console.log("LIFF 初始化成功");
          console.log("AccessToken:", liff.getAccessToken());
        }
      } catch (err) {
        console.error("LIFF init error:", err);
      }

      const form = document.getElementById("paymentForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const pay_dt = document.getElementById("pay_dt").value;
        const category = document.getElementById("category").value;
        const item = document.getElementById("item").value;
        const amount = document.getElementById("amount").value;

        if (!pay_dt || !category || !item || !amount) {
          alert("請完整填寫表單！");
          return;
        }

        try {
          const resp = await fetch("/add", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + liff.getAccessToken()
            },
            body: JSON.stringify({ pay_dt, category, item, amount })
          });

          if (resp.ok) {
            await liff.sendMessages([{
              type: "text",
              text: `✅ 已新增：${pay_dt}, ${category}, ${item}, ${amount}`
            }]);
            alert("送出成功！");
            liff.closeWindow();
          } else {
            alert("送出失敗，請稍後再試");
          }
        } catch (err) {
          console.error(err);
          alert("發生錯誤，請檢查網路或伺服器設定");
        }
      });
    }
    main();
  </script>
</body>
</html>
