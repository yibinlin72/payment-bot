<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>新增消費紀錄</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    h2 { text-align: center; }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      max-width: 400px;
      margin: auto;
    }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select {
      width: 100%; padding: 8px; margin-top: 5px;
      border: 1px solid #ccc; border-radius: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #04a944; }
  </style>
</head>
<body>
  <h2>新增消費紀錄</h2>
  <form id="paymentForm">
    <label>日期</label>
    <input type="date" id="pay_dt" required>

    <label>類別</label>
    <select id="category" required>
      <option value="">請選擇</option>
      <option value="飲食">飲食</option>
      <option value="交通">交通</option>
      <option value="住宿">住宿</option>
    </select>

    <label>描述</label>
    <input type="text" id="item" placeholder="例如：午餐 / 高鐵票 / 飯店" required>

    <label>金額</label>
    <input type="number" id="amount" required>

    <button type="submit">送出</button>
  </form>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2008057774-P62MrMmp" }); // ← 換成你申請的 LIFF ID

        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          console.log("LIFF 初始化成功");
          console.log("AccessToken:", liff.getAccessToken());
        }
      } catch (err) {
        console.error("LIFF init error:", err);
      }
      const form = document.getElementById("paymentForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const pay_dt = document.getElementById("pay_dt").value;
        const category = document.getElementById("category").value;
        const item = document.getElementById("item").value;
        const amount = document.getElementById("amount").value;

        if (!pay_dt || !category || !item || !amount) {
          alert("請完整填寫表單！");
          return;
        }

        try {
          // 呼叫後端 API
          const resp = await fetch("/add", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + liff.getAccessToken()
            },
            body: JSON.stringify({ pay_dt, category, item, amount })
          });

          if (resp.ok) {
            // 回傳訊息到聊天室
            // await liff.sendMessages([{
            //   type: "text",
            //   text: `✅ 已新增：${pay_dt}, ${category}, ${item}, ${amount}`
            // }]);
            alert("送出成功！");
            liff.closeWindow(); // 關閉 LIFF 視窗
          } else {
            alert("送出失敗，請稍後再試");
          }
        } catch (err) {
          console.error(err);
          alert("發生錯誤，請檢查網路或伺服器設定");
        }
      });
    }
    main();
  </script>
</body>
</html>
