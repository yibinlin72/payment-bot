<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查詢消費紀錄</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    label {
      font-weight: bold;
      margin-right: 10px;
    }
    input {
      padding: 5px;
      margin: 5px 0;
    }
    button {
      padding: 6px 12px;
      margin: 10px 0;
      background: #4CAF50;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    details {
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      padding: 6px 10px;
    }
    summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      padding: 6px 10px;
      text-align: left;
    }
    tr:nth-child(even) {
      background: #f2f2f2;
    }
    tr:nth-child(odd) {
      background: #ffffff;
    }
    .total {
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>查詢消費紀錄</h2>
  <div>
    <label>查詢區間</label>
    <input type="date" id="startDate">
    <span> ~ </span>
    <input type="date" id="endDate">
    <button onclick="query()">查詢</button>
  </div>

  <div id="results"></div>
  <div id="grandTotal" class="total"></div>

  <script>
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    async function query() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const res = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ startDate, endDate })
      });
      const data = await res.json();

      let resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      let grandTotal = 0;

      Object.keys(data).forEach(category => {
        let records = data[category];
        let categoryTotal = records.reduce((sum, r) => sum + r.amount, 0);
        grandTotal += categoryTotal;

        let details = document.createElement("details");
        let summary = document.createElement("summary");
        summary.textContent = `${category} (小計: ${formatNumber(categoryTotal)})`;
        details.appendChild(summary);

        let table = document.createElement("table");
        let thead = document.createElement("thead");
        thead.innerHTML = "<tr><th>日期</th><th>項目</th><th>金額</th></tr>";
        table.appendChild(thead);

        let tbody = document.createElement("tbody");
        records.forEach(r => {
          let tr = document.createElement("tr");
          tr.innerHTML = `<td>${r.date}</td><td>${r.item}</td><td>${formatNumber(r.amount)}</td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        details.appendChild(table);
        resultsDiv.appendChild(details);
      });

      document.getElementById("grandTotal").textContent = `全部總和：${formatNumber(grandTotal)}`;
    }
  </script>
</body>
</html>
